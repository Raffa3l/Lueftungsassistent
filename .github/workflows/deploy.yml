# Baut den Lüftungsassistenten bei jedem Push auf main und veröffentlicht ihn
# auf GitHub Pages.
#
# Einmalige Voraussetzung im Repository:
#   Settings → Pages → Build and deployment → Source: «GitHub Actions»

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht überholen
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node-Version, mit der die App gebaut wird – unabhängig von der
          # Node-Laufzeit, in der die Actions selbst ausgeführt werden.
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm run test:run

      - name: Build (enthält die Typprüfung)
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
